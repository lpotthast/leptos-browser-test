# Vendored from leptos-rs/start-axum (the official Axum SSR template), with
# `cargo generate` placeholders resolved and the end-to-end (Playwright) defaults
# trimmed. Used only as a real-world fixture for `tests/smoke.rs`; not part of the
# published library API.
#
# Deviations from the template: every dependency opts out of default features and
# enables only what this app uses, and the release profiles follow the
# recommendation in the crate README ("Build profile").
[package]
name = "leptos-ssr-app"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8.22", default-features = false }
leptos_router = { version = "0.8.17", default-features = false }
leptos_meta = { version = "0.8.7", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"], optional = true }
console_error_panic_hook = { version = "0.1.7", default-features = false, optional = true }
leptos_axum = { version = "0.8.10", default-features = false, features = ["default"], optional = true }
tokio = { version = "1.53.2", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal"], optional = true }
wasm-bindgen = { version = "0.2.129", default-features = false, optional = true }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

# Recommended test profiles (see the crate README, "Build profile"): a small, optimized
# WASM bundle that still builds incrementally, and a server that builds about as quickly
# as a dev build.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
incremental = true
debug-assertions = true
overflow-checks = true

[profile.server-release]
inherits = "dev"
opt-level = 1

[package.metadata.leptos]
output-name = "leptos-ssr-app"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
bin-profile-release = "server-release"
