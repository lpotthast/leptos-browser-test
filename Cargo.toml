[package]
name = "leptos-browser-test"
version = "0.3.0"
edition = "2024"
rust-version = "1.89.0"
authors = ["Lukas Potthast <privat@lukas-potthast.de>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/lpotthast/leptos-browser-test"
documentation = "https://docs.rs/leptos-browser-test"
description = "Leptos test-app launcher for browser-driven integration tests."
categories = ["development-tools::testing", "web-programming"]
keywords = ["leptos", "browser", "webdriver", "testing"]
include = ["/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]

[dependencies]
rootcause = { version = "0.13.0", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
tokio = { version = "1.50.0", default-features = false, features = ["io-std", "io-util", "macros", "process"] }
tokio-process-tools = { version = "0.11.2", default-features = false }
tracing = { version = "0.1.44", default-features = false }
unwrap-infallible = { version = "1.0.0", default-features = false }

[dev-dependencies]
assertr = { version = "0.6.0", default-features = false }
reqwest = { version = "0.13.3", default-features = false }
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = "warn"
